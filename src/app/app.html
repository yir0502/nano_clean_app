<mat-sidenav-container
  class="app-container"
  autosize
  (touchstart)="onEdgeSwipeStart($event)"
  (touchmove)="onEdgeSwipeMove($event)"
  (touchend)="onEdgeSwipeEnd($event)">

  <mat-sidenav
    #drawer
    mode="over"
    position="start"
    [opened]="menuOpen()"
    (closedStart)="menuOpen.set(false)"
    (touchstart)="onDrawerSwipeStart($event)"
    (touchmove)="onDrawerSwipeMove($event)"
    (touchend)="onDrawerSwipeEnd($event)"
    class="bubbly-drawer">

    <div class="drawer-header">
      <div class="logo-drawer" role="img" aria-label="Logo principal"></div>
      <button mat-icon-button type="button" (click)="toggleMenu()" aria-label="Cerrar menú lateral">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-nav-list class="drawer-list">
      <a
        mat-list-item
        *ngFor="let option of additionalNavOptions"
        [routerLink]="option.path"
        routerLinkActive="active-drawer-link"
        [routerLinkActiveOptions]="{ exact: option.exact === true }"
        (click)="menuOpen.set(false)">
        <mat-icon matListItemIcon>{{ option.icon }}</mat-icon>
        <span matListItemTitle>{{ option.label }}</span>
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item *ngIf="auth.isLoggedIn()" (click)="logoutAndClose()">
        <mat-icon matListItemIcon color="warn">logout</mat-icon>
        <span matListItemTitle>Salir</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div
      *ngIf="!hideChrome() && !menuOpen()"
      class="drawer-edge-zone"
      (touchstart)="onEdgeSwipeStart($event)"
      (touchmove)="onEdgeSwipeMove($event)"
      (touchend)="onEdgeSwipeEnd($event)">
    </div>

    <mat-toolbar *ngIf="!hideChrome()" color="primary" class="bubbly">
      <button
        type="button"
        class="topbar-menu-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir o cerrar menú de navegación">
        <mat-icon>{{ menuOpen() ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
      <div class="logo-toolbar" role="img" aria-label="Logo principal"></div>
    </mat-toolbar>

    <main class="page" [class.with-nav]="!hideChrome()">
      <router-outlet />
    </main>

    <div
      *ngIf="!hideChrome() && !hideFab() && orbMenuOpen()"
      class="orb-backdrop"
      (click)="closeOrbMenu()">
    </div>

    <div *ngIf="!hideChrome()" class="bottom-dock-shell">
      <nav
        class="bottom-nav-dock"
        [class.without-center-orb]="hideFab()"
        role="navigation"
        aria-label="Navegación inferior">

        @for (burst of trailBursts(); track burst.id) {
          <div
            class="water-droplet-trail"
            [class.dir-right]="burst.dir === 'right'"
            [class.dir-left]="burst.dir === 'left'"
            [style.left.px]="burst.left"
            [style.width.px]="burst.width"
            aria-hidden="true">
            <span class="trail-stream"></span>
            <span class="trail-drop trail-drop--1"></span>
            <span class="trail-drop trail-drop--2"></span>
          </div>
        }

        <div
          *ngIf="dropletVisible()"
          class="water-droplet-indicator"
          [class.moving-right]="dropletMotion() === 'right'"
          [class.moving-left]="dropletMotion() === 'left'"
          [style.transform]="'translateX(' + dropletLeft() + 'px)'"
          [style.width.px]="dropletWidth()"
          aria-hidden="true">
          <span class="droplet-body"></span>
          <span class="droplet-bead"></span>
        </div>

        <a
          #navTabEl
          *ngFor="let item of leftBottomNavItems"
          class="nav-tab"
          [class.has-droplet]="dropletVisible()"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact === true }">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>

        <div *ngIf="!hideFab()" class="center-orb-slot">
          <div
            class="orb-actions-fan"
            [class.open]="orbMenuOpen()"
            role="group"
            aria-label="Acciones rápidas">
            <button
              type="button"
              class="orb-action orb-action--pedido"
              [attr.tabindex]="orbMenuOpen() ? 0 : -1"
              (click)="goToNuevoPedido()"
              aria-label="Nuevo pedido">
              <span class="orb-action__icon" aria-hidden="true">
                <mat-icon>local_laundry_service</mat-icon>
              </span>
              <span>Nuevo Pedido</span>
            </button>

            <button
              type="button"
              class="orb-action orb-action--egreso"
              [attr.tabindex]="orbMenuOpen() ? 0 : -1"
              (click)="goToNuevoEgreso()"
              aria-label="Nuevo egreso">
              <span class="orb-action__icon" aria-hidden="true">
                <mat-icon>trending_down</mat-icon>
              </span>
              <span>Nuevo Egreso</span>
            </button>
          </div>

          <button
            type="button"
            class="center-water-orb"
            [class.open]="orbMenuOpen()"
            [attr.aria-expanded]="orbMenuOpen()"
            (click)="toggleOrbMenu()"
            aria-label="Acciones rápidas de creación">
            <span class="orb-water-layer" aria-hidden="true"></span>
            <svg class="orb-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></line>
              <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></line>
            </svg>
          </button>
        </div>

        <a
          #navTabEl
          *ngFor="let item of rightBottomNavItems"
          class="nav-tab"
          [class.has-droplet]="dropletVisible()"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact === true }">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </nav>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-loader />
