<div class="clientes-container">
    
    <header class="page-header">
        <h1><mat-icon>people_alt</mat-icon> Clientes</h1>
        <button mat-flat-button color="primary" (click)="openClienteDialog()">
            <mat-icon>add</mat-icon> Nuevo Cliente
        </button>
    </header>

    <mat-card class="search-actions-card">
        <mat-card-content class="search-content">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Buscar cliente</mat-label>
                <input matInput [ngModel]="q()" (ngModelChange)="onQInput($event)" placeholder="Nombre, teléfono...">
                <mat-icon matPrefix>search</mat-icon>
                <button *ngIf="q()" matSuffix mat-icon-button (click)="onQInput('')"><mat-icon>close</mat-icon></button>
            </mat-form-field>

            <button mat-stroked-button color="accent" (click)="onMassMessage()">
                <mat-icon>campaign</mat-icon> Mensaje Masivo
            </button>
        </mat-card-content>
    </mat-card>

    <div *ngIf="loading() && !items().length" class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="cliente-grid" *ngIf="items().length > 0">
        <mat-card *ngFor="let c of items()" class="cliente-card" (click)="openClienteDialog(c, $event)">
            <div class="card-header">
                <div class="avatar-placeholder">{{ c.nombre.charAt(0).toUpperCase() }}</div>
                <div class="info">
                    <div class="name-row">
                        <span class="name">{{ c.nombre }}</span>
                        <div class="status-dot" 
                             [style.background-color]="getStatusColor(c.ultima_visita)"
                             matTooltip="Estado de actividad del cliente">
                        </div>
                    </div>
                    <div class="meta">{{ c.telefono }}</div>
                </div>
                <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="onViewOrders(c, $event)">
                        <mat-icon>receipt</mat-icon> Ver Pedidos
                    </button>
                    <button mat-menu-item (click)="onSendProgrammedReminder(c, $event)" [disabled]="!c.permite_whatsapp">
                        <mat-icon>whatsapp</mat-icon> Recordatorio
                    </button>
                    <button mat-menu-item (click)="onDelete(c, $event)" class="warn-text">
                        <mat-icon color="warn">delete</mat-icon> Eliminar
                    </button>
                </mat-menu>
            </div>
            
            <mat-card-content class="card-body">
               <div class="tag-group">
                   <span class="tag" [class.active]="c.permite_whatsapp">
                       <mat-icon>chat</mat-icon> {{ c.permite_whatsapp ? 'WA Activo' : 'Sin WA' }}
                   </span>
                   <span class="tag freq" *ngIf="c.frecuencia_recordatorio > 0">
                       <mat-icon>update</mat-icon> {{ c.frecuencia_recordatorio }} días
                   </span>
               </div>
               <p class="address" *ngIf="c.direccion">{{ c.direccion }}</p>
            </mat-card-content>
        </mat-card>
    </div>

    <div *ngIf="!loading() && items().length === 0" class="empty-state">
        <mat-icon>person_off</mat-icon>
        <p>No se encontraron clientes.</p>
    </div>
</div>
