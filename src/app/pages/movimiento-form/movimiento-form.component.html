<div class="screen-container" [class.theme-egreso]="form.get('tipo')?.value === 'egreso'"
  [class.theme-ingreso]="form.get('tipo')?.value === 'ingreso'">

  <div class="header" [formGroup]="form">
    <button mat-icon-button (click)="close()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="toggle-wrapper">
      <mat-button-toggle-group formControlName="tipo" class="custom-toggle" aria-label="Tipo">
        <mat-button-toggle value="ingreso">Ingreso</mat-button-toggle>
        <mat-button-toggle value="egreso">Egreso</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <button *ngIf="isEdit()" mat-icon-button color="warn" (click)="delete()">
      <mat-icon>delete_outline</mat-icon>
    </button>
    <div *ngIf="!isEdit()" style="width: 40px"></div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="main-form" *ngIf="!loading(); else loadingTpl">

    <section class="hero-section">
      <div class="hero-label">Monto</div>
      <div class="hero-input-wrapper">
        <span class="currency-symbol">$</span>
        <input matInput formControlName="monto" type="number" inputmode="decimal" placeholder="0.00" class="giant-input"
          autoFocus>
      </div>
      <span class="currency-code">MXN</span>

      <div class="error-msg" *ngIf="form.get('monto')?.touched && form.get('monto')?.invalid">
        Requerido
      </div>
    </section>

    <section class="details-card">

      <mat-form-field appearance="outline" class="clean-field">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="categoria_id">
          <mat-option *ngFor="let c of categorias()" [value]="c.id">
            {{ c.nombre }}
          </mat-option>
        </mat-select>
        <mat-icon matPrefix class="field-icon">category</mat-icon>
        <mat-error>Requerido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="clean-field">
        <mat-label>Método de pago</mat-label>
        <mat-select formControlName="metodo_pago">
          <mat-option *ngFor="let m of metodosPago" [value]="m.id">
            {{ m.label }}
          </mat-option>
        </mat-select>
        <mat-icon matPrefix class="field-icon">payments</mat-icon>
      </mat-form-field>

      <div class="row-dual">
        <mat-form-field appearance="outline" class="clean-field">
          <mat-label>Fecha</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="fecha" readonly>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker [touchUi]="true"></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="clean-field">
          <mat-label>Sucursal</mat-label>
          <mat-select formControlName="sucursal_id">
            <mat-option [value]="null">Ninguna</mat-option>
            <mat-option *ngFor="let s of sucursales" [value]="s.id">{{ s.nombre }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="clean-field">
        <mat-label>Nota (Opcional)</mat-label>
        <textarea matInput rows="2" formControlName="nota"></textarea>
      </mat-form-field>

    </section>

    <div class="sticky-footer">
      <button mat-flat-button class="btn-save" type="submit" [disabled]="saving() || form.invalid">
        <mat-spinner *ngIf="saving()" [diameter]="24" class="spinner-white"></mat-spinner>
        <span *ngIf="!saving()">Guardar Movimiento</span>
        <mat-icon *ngIf="!saving()">check</mat-icon>
      </button>
    </div>

  </form>
</div>

<ng-template #loadingTpl>
  <div class="mv-loading">
    
  </div>
</ng-template>
